name: Replace Our Story engineering image

on:
  push:
    branches: [main]

jobs:
  replace-image:
    if: contains(github.event.head_commit.message, 'Embed uploaded Our Story image') == false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Write uploaded image
        env:
          IMAGE_B64: ""
        python - <<'PY'
        import base64
        from PIL import Image
        from io import BytesIO
        image = Image.open(BytesIO(base64.b64decode(__import__('os').environ['IMAGE_B64'])))
        image.save('public/images/our-story-engineering.png', format='PNG', optimize=True)
        print(image.size)
        PY

      - name: Commit image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/our-story-engineering.png
          git diff --cached --quiet && exit 0
          git commit -m "Embed uploaded Our Story image"
          git push
