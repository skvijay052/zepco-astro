name: Generate Our Story PNG

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create PNG image
        run: |
          echo '' | base64 -d > public/images/our-story-engineering.png
          file public/images/our-story-engineering.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/our-story-engineering.png
          git commit -m "Add Our Story engineering PNG"
          git push
