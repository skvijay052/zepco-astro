name: Restore full Our Story engineering image

on:
  push:
    branches: [main]

jobs:
  restore-image:
    if: contains(github.event.head_commit.message, 'Restore full Our Story engineering image') == false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore uploaded image from previous workflow payload
        run: |
          git show 23169b66c5af7483ecd4908376c657607cd6b889:.github/workflows/replace-our-story-image.yml > /tmp/source.yml
          python - <<'PY'
          import base64, re
          text = open('/tmp/source.yml', 'r', encoding='utf-8').read()
          match = re.search(r'IMAGE_B64:\s*"([^"]+)"', text, re.S)
          if not match:
              raise SystemExit('IMAGE_B64 payload not found')
          data = base64.b64decode(match.group(1))
          open('/tmp/our-story-source.jpg', 'wb').write(data)
          print(f'Restored source image: {len(data)} bytes')
          PY
          python - <<'PY'
          from PIL import Image
          src = Image.open('/tmp/our-story-source.jpg')
          print('Source:', src.format, src.size, src.mode)
          src.save('public/images/our-story-engineering.png', format='PNG', optimize=True)
          PY

      - name: Commit full-resolution PNG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/our-story-engineering.png
          git commit -m "Restore full Our Story engineering image"
          git push
